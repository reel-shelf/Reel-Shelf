<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --bg-color: #0f1015;
            --surface-color: #1a1c23;
            --surface-hover: #262935;
            --text-color: #ffffff;
            --text-secondary: #a0a6b8;
            --accent-color: #00a8e1; /* Prime Video Blue */
            --accent-hover: #0082b3;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemItem, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(15,16,21,0.9), rgba(15,16,21,0));
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .nav-links span {
            cursor: pointer;
            transition: color var(--transition-speed);
        }

        .nav-links span:hover {
            color: var(--text-color);
        }
