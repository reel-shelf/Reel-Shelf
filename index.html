<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel Shelf · Free movies, legally</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a14">
<meta name="description" content="Watch free movies legally, from official channels and Creative Commons films.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<style>
:root{color-scheme:dark;--bg:#0c0a14;--surface:#1a1626;--surface2:#241f35;--line:#2e2842;--text:#f3effa;--muted:#a59dba;--accent:#f2b84b;--ink:#1a1405}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.brand{font:900 24px/1 Fraunces,Georgia,serif;letter-spacing:-.01em}
.brand i{color:var(--accent);font-style:normal}

/* top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:linear-gradient(var(--bg) 60%,transparent)}

/* hero */
.hero{position:relative;margin:0 16px 8px;border-radius:18px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:#000}
.hero .img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.75}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,10,20,.97) 8%,rgba(12,10,20,.3) 60%,transparent)}
.hero .in{position:relative;z-index:1;padding:20px}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--accent);border-radius:6px;padding:3px 8px}
.hero h1{font:900 clamp(30px,8vw,48px)/1.02 Fraunces,Georgia,serif;margin:10px 0 6px}
.hero p{margin:0 0 14px;color:#d8d2e6;max-width:52ch}
.meta{color:var(--muted);font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--ink)}
.btn.alt{background:rgba(255,255,255,.12);color:var(--text)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line)}
.dots button[aria-current="true"]{background:var(--accent);width:22px;border-radius:4px}

/* rows */
.row{margin:18px 0 6px}
.row h2{font:700 19px/1.2 "DM Sans",sans-serif;margin:0 16px 10px}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tile{flex:none;width:min(62vw,250px);scroll-snap-align:start;background:none;border:0;padding:0;text-align:left}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface)}
.thumb .img{position:absolute;inset:0;background-size:cover;background-position:center}
.thumb .ttl{position:absolute;inset:auto 0 0 0;padding:28px 10px 8px;font:800 16px/1.1 Fraunces,Georgia,serif;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.thumb .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.tile .sub{display:block;margin-top:6px;font-size:13px;color:var(--muted);padding:0 2px}

/* grid (search, my list) */
.page{padding:4px 16px 20px}
.page h1{font:900 30px/1.1 Fraunces,Georgia,serif;margin:4px 0 14px}
.search{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid .tile{width:auto}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.empty b{display:block;color:var(--text);font:700 20px Fraunces,Georgia,serif;margin-bottom:6px}
.note{margin:28px 16px 0;padding:16px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.55}
.note b{color:var(--text)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(12,10,20,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:9px 0 10px;color:var(--muted);font-size:12px;display:grid;justify-items:center;gap:2px}
.nav button span{font-size:20px;line-height:1}
.nav button[aria-current="page"]{color:var(--accent)}

/* details sheet */
.sheet{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet .card{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .cover{position:relative;aspect-ratio:16/9;background:#000}
.sheet .cover .img{position:absolute;inset:0;background-size:cover;background-position:center}
.sheet .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:17px}
.sheet .body{padding:16px}
.sheet h3{font:900 26px/1.1 Fraunces,Georgia,serif;margin:0 0 4px}
.sheet .lic{font-size:12px;color:var(--muted);margin-top:14px}

/* player */
#player{position:fixed;inset:0;z-index:20;background:#050407;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.pbar{display:flex;align-items:center;gap:12px;padding:12px 16px}
.pbar h2{flex:1;margin:0;font:800 19px/1.2 Fraunces,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:17px}
.screen{position:relative;width:100%;max-width:1000px;margin:0 auto;aspect-ratio:16/9;background:#000}
.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.perr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;color:var(--muted)}
.pbody{max-width:1000px;margin:0 auto;padding:14px 0 30px}
.pbody .pad{padding:0 16px}
.srv{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.srv button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.srv button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
</style>
</head>
<body>

<header class="bar"><div class="brand">Reel<i>Shelf</i></div></header>
<main id="main"></main>

<nav class="nav" aria-label="Sections">
  <button data-v="home" aria-current="page"><span>⌂</span>Home</button>
  <button data-v="search"><span>⌕</span>Search</button>
  <button data-v="list"><span>＋</span>My List</button>
</nav>

<!-- film details -->
<div class="sheet" id="sheet" hidden><div class="card" id="sheetc" role="dialog" aria-modal="true"></div></div>

<!-- player -->
<div id="player" hidden role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="pbar"><button class="round" id="pclose" aria-label="Close player">✕</button><h2 id="ptitle"></h2></div>
  <div class="screen" id="screen"></div>
  <div class="pbody">
    <div class="pad"><div class="srv" id="srv"></div><div class="meta" id="pmeta"></div><p id="pdesc"></p></div>
    <div class="row"><h2>Up next</h2><div class="scroller" id="uprow"></div></div>
  </div>
</div>

<script>
/* ===================== CATALOGUE =====================
   Only films whose makers released them under a Creative Commons licence.
   Servers: mp4 = direct file, yt = official YouTube upload, pt = Blender's own video site */
const MP4="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/";
const FILMS=[
 {id:"fr-drive",t:"Drive",g:"Action",row:"fr",d:"Full movie from FilmRise's official YouTube channel.",lic:"Streamed from FilmRise's official YouTube channel",yt:"uDEGZwk_nOI",s:[["yt","uDEGZwk_nOI"]]},
 {id:"fr-mort",t:"Mortuary",y:2005,m:94,g:"Horror",row:"fr",d:"A widow and her kids move into an old funeral home in a small California town, and something buried there won't stay dead. Directed by Tobe Hooper.",lic:"Streamed from FilmRise's official YouTube channel",yt:"Ekfn-RVo8XI",s:[["yt","Ekfn-RVo8XI"]]},
 {id:"fr-run",t:"The Runner",g:"Thriller",row:"fr",d:"Full movie from FilmRise's official YouTube channel.",lic:"Streamed from FilmRise's official YouTube channel",yt:"yNB3YmKJh54",s:[["yt","yNB3YmKJh54"]]},
 {id:"bbb",t:"Big Buck Bunny",y:2008,m:10,g:"Animation",row:"anim",d:"A giant rabbit gets even with three bullying rodents.",lic:"CC BY 3.0 · Blender Foundation",yt:"aqz-KE-bpKQ",s:[["mp4",MP4+"BigBuckBunny.mp4"],["yt","aqz-KE-bpKQ"]]},
 {id:"sin",t:"Sintel",y:2010,m:15,g:"Animation",row:"anim",d:"A young woman searches for the baby dragon she befriended.",lic:"CC BY 3.0 · Blender Foundation",yt:"eRsGyueVLvQ",s:[["mp4",MP4+"Sintel.mp4"],["yt","eRsGyueVLvQ"]]},
 {id:"spr",t:"Spring",y:2019,m:8,g:"Animation",row:"anim",d:"A shepherd girl and her dog face the spirits of the mountain.",lic:"CC BY 4.0 · Blender Foundation",yt:"WhWc3b3KhnY",s:[["yt","WhWc3b3KhnY"],["pt","3d95fb3d-c866-42c8-9db1-fe82f48ccb95"]]},
 {id:"cos",t:"Cosmos Laundromat",y:2015,m:12,g:"Animation",row:"anim",d:"A lonely sheep is offered a new life by a mysterious salesman.",lic:"CC BY 4.0 · Blender Foundation",yt:"Y-rmzh0PI3c",s:[["yt","Y-rmzh0PI3c"]]},
 {id:"tos",t:"Tears of Steel",y:2012,m:12,g:"Sci-Fi",row:"adv",d:"Scientists in Amsterdam try to stop a robot invasion. Live action with CGI.",lic:"CC BY 3.0 · Blender Foundation",yt:"R6MlUcmOul8",s:[["mp4",MP4+"TearsOfSteel.mp4"],["yt","R6MlUcmOul8"]]},
 {id:"ele",t:"Elephants Dream",y:2006,m:11,g:"Sci-Fi",row:"anim",d:"Two men explore a strange machine world. The very first open movie.",lic:"CC BY 2.5 · Blender Foundation",yt:"TLkA0RELQ1g",s:[["mp4",MP4+"ElephantsDream.mp4"],["yt","TLkA0RELQ1g"]]}
];
const ROWS=[["fr","Free from FilmRise"],["anim","Animated shorts"],["adv","Sci-fi"]];
const FEATURED=["fr-mort","bbb","fr-drive","spr","fr-run","sin"];
const HUES={Action:"#4a2a10",Thriller:"#2a1f3f",Horror:"#4a1530",Comedy:"#5a4310",Adventure:"#163f3a","Sci-Fi":"#15284a",Animation:"#2f5d3a"};

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const byId=id=>FILMS.find(f=>f.id===id);
const info=f=>[f.y,f.g,f.m&&f.m+" min"].filter(Boolean).join(" · ");
function pic(f){ // poster image: YouTube thumbnail or Internet Archive item picture, over a colour fallback
  const url=`https://i.ytimg.com/vi/${f.yt}/hqdefault.jpg`;
  return `background-image:url('${url}'),linear-gradient(150deg,${HUES[f.g]||"#2a2240"},#0c0a14)`;
}

/* ===================== SAVED ON THIS PHONE ===================== */
let list=store.get("rs-list",[]),watch=store.get("rs-watch",{});   // watch = {id:{t:seconds,d:duration,at:time}}
function persist(){store.set("rs-list",list);store.set("rs-watch",watch)}

/* ===================== SCREENS ===================== */
let view="home",heroI=0,heroTimer=null,q="",genre="All";
function tile(f){
  const w=watch[f.id],p=w&&w.d?Math.min(100,w.t/w.d*100):0;
  return `<button class="tile" data-open="${f.id}"><div class="thumb"><div class="img" style="${pic(f)}"></div><div class="ttl">${esc(f.t)}</div>${p>1?`<div class="prog" style="width:${p}%"></div>`:""}</div><span class="sub">${info(f)}</span></button>`;
}
const rowHTML=(title,films)=>films.length?`<section class="row"><h2>${title}</h2><div class="scroller">${films.map(tile).join("")}</div></section>`:"";
function homeView(){
  const f=byId(FEATURED[heroI]);
  const cont=Object.entries(watch).sort((a,b)=>b[1].at-a[1].at).map(([id])=>byId(id)).filter(Boolean);
  return `<section class="hero"><div class="img" style="${pic(f)}"></div><div class="in">
    <span class="badge">Featured</span><h1>${esc(f.t)}</h1>
    <div class="meta">${info(f)}</div><p>${esc(f.d)}</p>
    <div class="btns"><button class="btn" data-play="${f.id}">▶ Play</button><button class="btn alt" data-save="${f.id}">${list.includes(f.id)?"✓ My List":"＋ My List"}</button></div></div></section>
  <div class="dots">${FEATURED.map((id,i)=>`<button data-hero="${i}" aria-label="Featured ${i+1}" aria-current="${i===heroI}"></button>`).join("")}</div>
  ${rowHTML("Continue watching",cont)}
  ${rowHTML("All movies",FILMS)}
  ${ROWS.map(([k,t])=>rowHTML(t,FILMS.filter(f=>f.row===k))).join("")}
  ${note()}`;
}
function searchView(){
  const gs=["All",...new Set(FILMS.map(f=>f.g))];
  return `<div class="page"><h1>Search</h1>
  <input class="search" id="q" type="search" placeholder="Movies, genres, years" value="${esc(q)}" autocomplete="off" aria-label="Search movies">
  <div class="chips">${gs.map(g=>`<button class="chip" data-g="${g}" aria-pressed="${g===genre}">${g}</button>`).join("")}</div>
  <div id="res">${resHTML()}</div></div>`;
}
function resHTML(){
  const t=q.trim().toLowerCase();
  const r=FILMS.filter(f=>(genre==="All"||f.g===genre)&&(!t||(f.t+" "+f.g+" "+(f.y||"")+" "+f.d).toLowerCase().includes(t)));
  return r.length?`<div class="grid">${r.map(tile).join("")}</div>`:`<div class="empty"><b>Nothing found</b>Try another word or genre.</div>`;
}
function listView(){
  const r=list.map(byId).filter(Boolean);
  return `<div class="page"><h1>My List</h1>${Object.keys(watch).length?`<div class="btns" style="margin-bottom:14px"><button class="btn alt" data-act="clear">Clear watch history</button></div>`:""}${r.length?`<div class="grid">${r.map(tile).join("")}</div>`:`<div class="empty"><b>Your list is empty</b>Tap ＋ My List on any movie to save it here.</div>`}</div>`;
}
const note=()=>`<div class="note"><b>Why it's free.</b> Every movie here is shown legally. Feature films play from official studio and distributor YouTube channels like FilmRise, who own them and earn from the ads. The animated and sci-fi shorts are released by the Blender Foundation under Creative Commons licences.</div>`;
function render(){
  const h={home:homeView,search:searchView,list:listView}[view]();
  $("#main").innerHTML=h;
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view?"page":"false"));
}
function go(v){view=v;render();scrollTo(0,0);clearInterval(heroTimer);
  if(v==="home")heroTimer=setInterval(()=>{if(!$("#player").hidden||!$("#sheet").hidden)return;heroI=(heroI+1)%FEATURED.length;if(view==="home")render()},8000)}
document.querySelector(".nav").onclick=e=>{const b=e.target.closest("[data-v]");if(b)go(b.dataset.v)};
$("#main").addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;$("#res").innerHTML=resHTML()}});
document.addEventListener("click",e=>{
  const t=e.target;
  const o=t.closest("[data-open]");if(o){openSheet(o.dataset.open);return}
  const p=t.closest("[data-play]");if(p){closeSheet();openPlayer(p.dataset.play);return}
  const s=t.closest("[data-save]");if(s){toggleList(s.dataset.save);return}
  const hb=t.closest("[data-hero]");if(hb){heroI=+hb.dataset.hero;render();return}
  const g=t.closest("[data-g]");if(g){genre=g.dataset.g;render();return}
  const a=t.closest("[data-act]");if(a){watch={};persist();render()}
});
function toggleList(id){list=list.includes(id)?list.filter(x=>x!==id):[id,...list];persist();
  if(!$("#sheet").hidden)openSheet(id);render()}

/* ===================== DETAILS SHEET ===================== */
function openSheet(id){const f=byId(id);
  $("#sheetc").innerHTML=`<div class="cover"><div class="img" style="${pic(f)}"></div><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="body"><h3>${esc(f.t)}</h3><div class="meta">${info(f)}</div><p>${esc(f.d)}</p>
  <div class="btns"><button class="btn" data-play="${f.id}">▶ ${watch[f.id]&&watch[f.id].t>30?"Resume":"Play"}</button><button class="btn alt" data-save="${f.id}">${list.includes(f.id)?"✓ My List":"＋ My List"}</button></div>
  <div class="lic">${esc(f.lic)}</div></div>`;
  $("#sheet").hidden=false;document.body.classList.add("lock")}
function closeSheet(){$("#sheet").hidden=true;if($("#player").hidden)document.body.classList.remove("lock")}
$("#sheet").onclick=e=>{if(e.target.id==="sheet"||e.target.closest("[data-close]"))closeSheet()};

/* ===================== PLAYER ===================== */
const SRVNAME={ia:"Internet Archive",mp4:"Reel Shelf Player",yt:"YouTube",pt:"Blender Video"};
let cur=null,srvIdx=0;
function openPlayer(id){cur=byId(id);srvIdx=0;
  $("#player").hidden=false;document.body.classList.add("lock");$("#player").scrollTop=0;
  $("#ptitle").textContent=cur.t;$("#pmeta").textContent=`${info(cur)} · ${cur.lic}`;$("#pdesc").textContent=cur.d;
  const same=FILMS.filter(f=>f.id!==id&&f.row===cur.row),other=FILMS.filter(f=>f.id!==id&&f.row!==cur.row);
  $("#uprow").innerHTML=[...same,...other].slice(0,8).map(tile).join("").replaceAll("data-open","data-next");
  const w=watch[id]||{t:0,d:0};w.at=Date.now();watch[id]=w;persist();
  loadServer();try{history.pushState({p:1},"")}catch(e){}
}
function loadServer(){
  const [type,src]=cur.s[srvIdx],sc=$("#screen");
  $("#srv").innerHTML=cur.s.length>1?cur.s.map((s,i)=>`<button data-srv="${i}" aria-pressed="${i===srvIdx}">Server ${i+1} · ${SRVNAME[s[0]]}</button>`).join(""):"";
  if(type==="mp4"){
    sc.innerHTML=`<video controls autoplay playsinline preload="metadata" src="${src}"></video>`;
    const v=sc.querySelector("video"),w=watch[cur.id];
    v.onloadedmetadata=()=>{if(w&&w.t>30&&w.t<v.duration-20)v.currentTime=w.t};
    let last=0;v.ontimeupdate=()=>{if(Date.now()-last<4000)return;last=Date.now();watch[cur.id]={t:v.currentTime,d:v.duration,at:Date.now()};persist()};
    v.onerror=()=>{sc.innerHTML=`<div class="perr">This server isn't working right now.${cur.s.length>1?"<br>Try Server 2 below.":""}</div>`};
    v.play&&v.play().catch(()=>{});
  }else if(type==="yt"){
    sc.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${src}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen title="${esc(cur.t)}"></iframe>`;
  }else if(type==="pt"){
    sc.innerHTML=`<iframe src="https://video.blender.org/videos/embed/${src}?autoplay=1&title=0&warningTitle=0" allow="autoplay; fullscreen" allowfullscreen title="${esc(cur.t)}"></iframe>`;
  }else{
    sc.innerHTML=`<iframe src="https://archive.org/embed/${src}" allow="autoplay; fullscreen" allowfullscreen webkitallowfullscreen title="${esc(cur.t)}"></iframe>`;
  }
}
function closePlayer(){if($("#player").hidden)return;$("#screen").innerHTML="";$("#player").hidden=true;document.body.classList.remove("lock");cur=null;render()}
$("#srv").onclick=e=>{const b=e.target.closest("[data-srv]");if(!b)return;srvIdx=+b.dataset.srv;loadServer()};
$("#uprow").onclick=e=>{const b=e.target.closest("[data-next]");if(!b)return;$("#screen").innerHTML="";openPlayer(b.dataset.next)};
$("#pclose").onclick=()=>{closePlayer();try{if(history.state&&history.state.p)history.back()}catch(e){}};
addEventListener("popstate",()=>closePlayer());   // phone back button closes the player
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#player").hidden)$("#pclose").click();else closeSheet()}});

/* ===================== START ===================== */
go("home");
</script>
</body>
</html>
